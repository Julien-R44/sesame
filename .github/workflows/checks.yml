name: checks

on:
  - push
  - pull_request
  - workflow_call

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run test
      - run: pnpm test:sql
